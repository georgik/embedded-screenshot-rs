name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --check

  test:
    name: Test (${{ matrix.package }} ${{ matrix.features }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # The esp-println feature is not host-testable: its build script
          # requires a console backend that only an app can select.
          - package: esp-screenshot
            features: ""
          - package: esp-screenshot
            features: "--features async,embedded-graphics"
          - package: screenshot-decoder
            features: ""
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.package }}-${{ matrix.features }}
      - run: cargo test -p ${{ matrix.package }} ${{ matrix.features }}

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p esp-screenshot --features async,embedded-graphics -- -D warnings
      - run: cargo clippy -p screenshot-decoder -- -D warnings
